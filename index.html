<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Newtab</title>
  <link rel="stylesheet" href="site.css" />
</head>
<body>
  <main id="app-root">
    <div id="status">Waiting for WASM...</div>
    <pre id="out"></pre>
  </main>
  <script src="pull.js"></script>
  <!-- This script tag stays empty — pull.js will fill it dynamically -->
  <script type="module" id="loader"></script>
  <script type="module">
  // Worker base that proxies your GitHub Pages site
  const WORKER_BASE = 'https://broad-meadow-a6f7.chrisjlove2022.workers.dev';

  const WASM_PATH = '/app.wasm'; // Worker should proxy this path to the repo root
  const MJS_PATH = '/app.mjs';   // Worker should proxy this too

  const statusEl = document.getElementById('status');
  const outEl = document.getElementById('out');

  function log(s) {
    outEl.textContent += s + '\n';
  }

  // Try to import the Emscripten-generated ES module loader if present
  async function tryImportLoader() {
    try {
      const loaderUrl = new URL(MJS_PATH, WORKER_BASE).toString();
      statusEl.textContent = 'Importing loader from ' + loaderUrl;
      const createModule = (await import(loaderUrl)).default;
      const Module = await createModule();
      statusEl.textContent = 'Module ready (via loader)';
      log('Exports: ' + Object.keys(Module).join(', '));
      // If you exported functions via Emscripten, call them via Module._my_exported
      if (typeof Module._my_exported === 'function') {
        const r = Module._my_exported();
        log('my_exported() -> ' + r);
      }
      // Notify parent (MetalChair) if embedded
      if (window.parent && window.parent !== window) {
        parent.postMessage({ type: 'wasm-ready' }, '*');
      }
      return true;
    } catch (e) {
      console.warn('Loader import failed, falling back to raw instantiate:', e);
      return false;
    }
  }

  // Raw instantiate fallback (for raw .wasm exports)
  async function rawInstantiate() {
    const wasmUrl = new URL(WASM_PATH, WORKER_BASE).toString();
    statusEl.textContent = 'Fetching WASM from ' + wasmUrl;
    try {
      if ('instantiateStreaming' in WebAssembly) {
        const resp = await fetch(wasmUrl, { credentials: 'same-origin' });
        if (resp.ok) {
          try {
            const { instance } = await WebAssembly.instantiateStreaming(resp, {});
            statusEl.textContent = 'WASM instantiated (streaming)';
            if (instance.exports && typeof instance.exports.my_exported === 'function') {
              const r = instance.exports.my_exported();
              log('my_exported() -> ' + r);
            } else {
              log('Exports: ' + Object.keys(instance.exports).join(', '));
            }
            if (window.parent && window.parent !== window) parent.postMessage({ type: 'wasm-ready' }, '*');
            return;
          } catch (streamErr) {
            console.warn('instantiateStreaming failed, falling back to arrayBuffer:', streamErr);
          }
        } else {
          throw new Error('Fetch failed: ' + resp.status);
        }
      }

      const resp2 = await fetch(wasmUrl, { credentials: 'same-origin' });
      if (!resp2.ok) throw new Error('Fetch failed: ' + resp2.status);
      const bytes = await resp2.arrayBuffer();
      const { instance } = await WebAssembly.instantiate(bytes, {});
      statusEl.textContent = 'WASM instantiated (arrayBuffer)';
      if (instance.exports && typeof instance.exports.my_exported === 'function') {
        const r = instance.exports.my_exported();
        log('my_exported() -> ' + r);
      } else {
        log('Exports: ' + Object.keys(instance.exports).join(', '));
      }
      if (window.parent && window.parent !== window) parent.postMessage({ type: 'wasm-ready' }, '*');
    } catch (err) {
      statusEl.textContent = 'WASM load failed';
      log('Error: ' + err);
      console.error(err);
    }
  }

  (async () => {
    const ok = await tryImportLoader();
    if (!ok) await rawInstantiate();
  })();
  </script>
</body>
</html>
